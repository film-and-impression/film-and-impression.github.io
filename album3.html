            <!-- <a href="img3.html" class="thumb">

            <div class="thumb">

            <div class="thumb">

        <!-- <div id="lightbox">
            <span class="close">&times;</span>
            <img id="lightbox-img" src="">
            <div id="lightbox-caption"></div>
        </div> -->

        <div id="lightbox">
        <span class="close">&times;</span>
        <div class="lightbox-content">
            <img id="lightbox-img">
            <div id="lightbox-caption"></div>
        </div>
        </div>

    </main>
    <footer>
        <p>&copy; 2025 Film & Impression</p>
    </footer>

    <script>
        console.log("Lightbox script loaded");
    const thumbnails = document.querySelectorAll('.gallery img');
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxCaption = document.getElementById('lightbox-caption');


    document.querySelectorAll(".thumb img").forEach(img => {
        img.addEventListener("click", () => {
        lightboxImg.src = img.dataset.full;
        lightbox.style.display = "flex";
        document.body.style.overflow = "hidden";
        });
    });

    // function openLightbox(src, text) {
    // img.onload = () => {
    //     content.classList.remove("portrait", "landscape");

    //     if (img.naturalHeight > img.naturalWidth) {
    //     content.classList.add("portrait");
    //     } else {
    //     content.classList.add("landscape");
    //     }
    // };

    // img.src = src;
    // caption.textContent = text;
    // lightbox.style.display = "flex";
    // }

    function closeLightbox() {
        lightbox.style.display = "none";
        lightboxImg.src = "";
        document.body.style.overflow = "";
    }

    lightbox.addEventListener("click", closeLightbox);

    document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
        closeLightbox();
        }
    });

    thumbnails.forEach(img => {
    img.addEventListener('click', () => {
        lightboxImg.src = img.dataset.full;
        lightboxCaption.textContent = img.dataset.caption || '';
        lightbox.style.display = 'flex';
    });
    });
    </script>
</body>
